name: Build Aimlock Dylib for FreeFire iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kiem tra code nguon
        uses: actions/checkout@v4

      - name: Cai dat Xcode command line tools
        run: |
          xcode-select --install || true
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          brew install gcc make cmake ninja

      - name: Tao cau truc thu muc
        run: |
          mkdir -p src include

      - name: Tao file memory_ops.h
        run: |
