                  g_state.head_avatar = found;
                  printf("[Aimlock] Head avatar at: 0x%llx\n", found);
              }

              // Scan head_frame
              found = find_pattern_in_memory(task, start, size, pattern_head_frame, sizeof(pattern_head_frame));
