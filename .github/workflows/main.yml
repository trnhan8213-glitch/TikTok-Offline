                  g_state.head_pic = found;
                  printf("[Aimlock] Head pic at: 0x%llx\n", found);
              }

              // Scan head_btn
              found = find_pattern_in_memory(task, start, size, pattern_head_btn, sizeof(pattern_head_btn));
              if (found) {
                  g_state.head_btn = found;
                  g_state.head_btn_left = found + 0x100;
                  g_state.head_btn_right = found + 0x200;
                  printf("[Aimlock] Head btn at: 0x%llx\n", found);
              }

              // Scan head_anim
              found = find_pattern_in_memory(task, start, size, pattern_head_anim, sizeof(pattern_head_anim));
              if (found) {
                  g_state.head_anim = found;
                  printf("[Aimlock] Head anim at: 0x%llx\n", found);
              }

              // Scan head_reborn
              found = find_pattern_in_memory(task, start, size, pattern_head_reborn, sizeof(pattern_head_reborn));
              if (found) {
                  g_state.head_reborn = found;
                  printf("[Aimlock] Head reborn at: 0x%llx\n", found);
              }

              // Scan head_sprite
              found = find_pattern_in_memory(task, start, size, pattern_head_sprite, sizeof(pattern_head_sprite));
              if (found) {
                  g_state.head_sprite = found;
                  printf("[Aimlock] Head sprite at: 0x%llx\n", found);
              }

              // Scan head_icon
              found = find_pattern_in_memory(task, start, size, pattern_head_icon, sizeof(pattern_head_icon));
              if (found) {
                  g_state.head_icon = found;
                  printf("[Aimlock] Head icon at: 0x%llx\n", found);
              }

              // Scan head_texture
              found = find_pattern_in_memory(task, start, size, pattern_head_texture, sizeof(pattern_head_texture));
              if (found) {
                  g_state.head_texture = found;
                  printf("[Aimlock] Head texture at: 0x%llx\n", found);
              }

              // Scan head_scale
              found = find_pattern_in_memory(task, start, size, pattern_head_scale, sizeof(pattern_head_scale));
              if (found) {
                  g_state.head_scale = found;
                  printf("[Aimlock] Head scale at: 0x%llx\n", found);
              }

              // Scan head_avatar
              found = find_pattern_in_memory(task, start, size, pattern_head_avatar, sizeof(pattern_head_avatar));
