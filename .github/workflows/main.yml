name: Build iOS Dynamic Library

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Xcode Command Line Tools
      run: |
        sudo xcode-select --install || true
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

    - name: Create directory structure
      run: |
        mkdir -p src include build

    - name: Create header file with offsets
      run: |
        cat > include/aimlock.h << 'EOF'
        #ifndef AIMLOCK_H
        #define AIMLOCK_H

        #include <mach/mach.h>
        #include <mach/mach_vm.h>
        #include <dlfcn.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <unistd.h>
        #include <math.h>

        #define OFFSET_ENTITY_LIST      0xFE90D808
        #define OFFSET_LOCAL_PLAYER     0x28
        #define OFFSET_ENTITY_COUNT     0x99
        #define OFFSET_PLAYER_POS_X     0x80
        #define OFFSET_PLAYER_POS_Y     0x98
        #define OFFSET_PLAYER_POS_Z     0x80
        #define OFFSET_ENEMY_TEAM       0xBE
        #define OFFSET_ENEMY_HEALTH     0x88
        #define OFFSET_VIEW_ANGLE       0xDE

        #define MAX_ENTITIES            256
        #define PI                      3.14159265358979323846

        typedef struct {
            float x;
            float y;
            float z;
        } Vector3;

        typedef struct {
            Vector3 position;
            int team;
            float health;
        } Entity;

        typedef struct {
            float pitch;
            float yaw;
        } ViewAngles;

        kern_return_t read_memory(task_t task, mach_vm_address_t address, void *buffer, mach_msg_type_number_t size);
        kern_return_t write_memory(task_t task, mach_vm_address_t address, void *buffer, mach_msg_type_number_t size);
        mach_vm_address_t get_module_base(const char *module_name);
        ViewAngles calculate_aim_angle(Vector3 local_pos, Vector3 target_pos, ViewAngles current_angle);
        void aimlock_loop(void);

        #endif
        EOF

    - name: Create source C file
      run: |
        cat > src/aimlock.c << 'EOF'
        #include "aimlock.h"
        #include <mach-o/dyld.h>
        #include <math.h>

        kern_return_t read_memory(task_t task, mach_vm_address_t address, void *buffer, mach_msg_type_number_t size) {
            mach_vm_size_t data_count = size;
            kern_return_t kr = mach_vm_read_overwrite(task, address, size, (mach_vm_address_t)buffer, &data_count);
            if (kr != KERN_SUCCESS) {
                return kr;
            }
            if (data_count != size) {
                return KERN_FAILURE;
            }
            return KERN_SUCCESS;
        }

        kern_return_t write_memory(task_t task, mach_vm_address_t address, void *buffer, mach_msg_type_number_t size) {
            kern_return_t kr = mach_vm_write(task, address, (vm_offset_t)buffer, size);
            if (kr != KERN_SUCCESS) {
                return kr;
            }
            return KERN_SUCCESS;
        }

        mach_vm_address_t get_module_base(const char *module_name) {
            uint32_t count = _dyld_image_count();
            for (uint32_t i = 0; i < count; i++) {
                const char *name = _dyld_get_image_name(i);
                if (name && strstr(name, module_name) != NULL) {
                    return (mach_vm_address_t)_dyld_get_image_header(i);
                }
            }
            return 0;
        }

        ViewAngles calculate_aim_angle(Vector3 local_pos, Vector3 target_pos, ViewAngles current_angle) {
            ViewAngles result;
            Vector3 delta;
            delta.x = target_pos.x - local_pos.x;
            delta.y = target_pos.y - local_pos.y;
            delta.z = target_pos.z - local_pos.z;

            float distance = sqrt(delta.x * delta.x + delta.y * delta.y + delta.z * delta.z);
            if (distance < 0.001) {
                result.pitch = current_angle.pitch;
                result.yaw = current_angle.yaw;
                return result;
            }

            result.yaw = atan2(delta.y, delta.x) * (180.0 / PI);
            if (result.yaw > 180.0) {
                result.yaw -= 360.0;
            } else if (result.yaw < -180.0) {
                result.yaw += 360.0;
            }

            result.pitch = -atan2(delta.z, sqrt(delta.x * delta.x + delta.y * delta.y)) * (180.0 / PI);
            if (result.pitch > 89.0) {
                result.pitch = 89.0;
            } else if (result.pitch < -89.0) {
                result.pitch = -89.0;
            }

            return result;
        }

        void aimlock_loop(void) {
            task_t task = mach_task_self();
            
            mach_vm_address_t module_base = get_module_base("FreeFire");
            if (module_base == 0) {
                return;
            }

            mach_vm_address_t entity_list_addr = module_base + OFFSET_ENTITY_LIST;
            mach_vm_address_t entity_list[MAX_ENTITIES];
            mach_msg_type_number_t size = sizeof(entity_list);
            kern_return_t kr = read_memory(task, entity_list_addr, entity_list, size);
            if (kr != KERN_SUCCESS) {
                return;
            }

            uint32_t entity_count = 0;
            mach_vm_address_t count_addr = module_base + OFFSET_ENTITY_COUNT;
            kr = read_memory(task, count_addr, &entity_count, sizeof(uint32_t));
            if (kr != KERN_SUCCESS || entity_count > MAX_ENTITIES) {
                return;
            }

            mach_vm_address_t local_player_addr = module_base + OFFSET_LOCAL_PLAYER;
            uintptr_t local_player_ptr = 0;
            kr = read_memory(task, local_player_addr, &local_player_ptr, sizeof(uintptr_t));
            if (kr != KERN_SUCCESS || local_player_ptr == 0) {
                return;
            }

            Vector3 local_pos;
            mach_vm_address_t pos_addr = local_player_ptr + OFFSET_PLAYER_POS_X;
            kr = read_memory(task, pos_addr, &local_pos, sizeof(Vector3));
            if (kr != KERN_SUCCESS) {
                return;
            }

            ViewAngles current_angle;
            mach_vm_address_t angle_addr = module_base + OFFSET_VIEW_ANGLE;
            kr = read_memory(task, angle_addr, &current_angle, sizeof(ViewAngles));
            if (kr != KERN_SUCCESS) {
                return;
            }

            Entity closest_enemy;
            float closest_distance = 999999.0;
            int found = 0;

            for (uint32_t i = 0; i < entity_count && i < MAX_ENTITIES; i++) {
                if (entity_list[i] == 0) continue;

                int team = 0;
                mach_vm_address_t team_addr = entity_list[i] + OFFSET_ENEMY_TEAM;
                kr = read_memory(task, team_addr, &team, sizeof(int));
                if (kr != KERN_SUCCESS) continue;

                int local_team = 0;
                mach_vm_address_t local_team_addr = local_player_ptr + OFFSET_ENEMY_TEAM;
                kr = read_memory(task, local_team_addr, &local_team, sizeof(int));
                if (kr != KERN_SUCCESS) continue;
                if (team == local_team) continue;

                float health = 0;
                mach_vm_address_t health_addr = entity_list[i] + OFFSET_ENEMY_HEALTH;
                kr = read_memory(task, health_addr, &health, sizeof(float));
                if (kr != KERN_SUCCESS || health <= 0.0) continue;

                Vector3 enemy_pos;
                mach_vm_address_t enemy_pos_addr = entity_list[i] + OFFSET_PLAYER_POS_X;
                kr = read_memory(task, enemy_pos_addr, &enemy_pos, sizeof(Vector3));
                if (kr != KERN_SUCCESS) continue;

                float dx = enemy_pos.x - local_pos.x;
                float dy = enemy_pos.y - local_pos.y;
                float dz = enemy_pos.z - local_pos.z;
                float dist = sqrt(dx*dx + dy*dy + dz*dz);

                if (dist < closest_distance) {
                    closest_distance = dist;
                    closest_enemy.position = enemy_pos;
                    closest_enemy.team = team;
                    closest_enemy.health = health;
                    found = 1;
                }
            }

            if (!found) {
                return;
            }

            ViewAngles aim_angle = calculate_aim_angle(local_pos, closest_enemy.position, current_angle);

            kr = write_memory(task, angle_addr, &aim_angle, sizeof(ViewAngles));
            if (kr != KERN_SUCCESS) {
                return;
            }
        }

        __attribute__((constructor))
        void initialize_aimlock(void) {
            aimlock_loop();
        }
        EOF

    - name: Create Makefile
      run: |
        cat > Makefile << 'EOF'
        CC = xcrun -sdk iphoneos clang
        CFLAGS = -arch arm64 -isysroot $(shell xcrun -sdk iphoneos --show-sdk-path) -dynamiclib -compatibility_version 1.0 -current_version 1.0 -O2
        TARGET = libaimlock.dylib
        SRC_DIR = src
        INC_DIR = include
        BUILD_DIR = build

        SOURCES = $(wildcard $(SRC_DIR)/*.c)
        OBJECTS = $(patsubst $(SRC_DIR)/%.c,$(BUILD_DIR)/%.o,$(SOURCES))

        all: $(BUILD_DIR) $(TARGET)

        $(BUILD_DIR):
        	mkdir -p $(BUILD_DIR)

        $(BUILD_DIR)/%.o: $(SRC_DIR)/%.c
        	$(CC) $(CFLAGS) -I$(INC_DIR) -c $< -o $@

        $(TARGET): $(OBJECTS)
        	$(CC) $(CFLAGS) -I$(INC_DIR) -o $(TARGET) $(OBJECTS)

        clean:
        	rm -rf $(BUILD_DIR) $(TARGET)
        EOF

    - name: Build library
      run: |
        make clean
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aimlock-library
        path: |
          libaimlock.dylib
          include/aimlock.h