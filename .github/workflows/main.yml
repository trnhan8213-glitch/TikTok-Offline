          void scan_all_offsets(void) {
              if (g_scanning) {
                  return;
              }
              g_scanning = true;
              task_t task = mach_task_self();
              mach_vm_address_t start = 0x100000000;
              mach_vm_size_t size = 0x40000000;
              mach_vm_address_t found = 0;

              printf("[Aimlock] Scanning all head offsets...\n");

              // Scan bone_head
              found = find_pattern_in_memory(task, start, size, pattern_bone_head, sizeof(pattern_bone_head));
              if (found) {
                  g_state.head_1 = found;
                  g_state.head_2 = found + 0x2000;
                  g_state.head_3 = found + 0x4000;
                  printf("[Aimlock] Bone head at: 0x%llx\n", found);
              }

              // Scan headshot
              found = find_pattern_in_memory(task, start, size, pattern_headshot, sizeof(pattern_headshot));
