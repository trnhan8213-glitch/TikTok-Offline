name: Build Aimlock Dylib with All Head Offsets

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Kiem tra code nguon
        uses: actions/checkout@v4

      - name: Cai dat build tools
        run: |
          xcode-select --install || true
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          brew install gcc make cmake ninja

      - name: Tao thu muc
        run: |
          mkdir -p src include

      - name: Tao file header memory_ops.h
        run: |
          cat > include/memory_ops.h << 'EOF'
          #ifndef MEMORY_OPS_H
          #define MEMORY_OPS_H

          #include <mach/mach.h>
          #include <mach/mach_vm.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <dlfcn.h>
          #include <objc/runtime.h>
          #include <objc/message.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <CoreGraphics/CoreGraphics.h>

          // Cac offset chinh tu data.txt
          #define OFFSET_BONE_HEAD_1 0x00080BD5
          #define OFFSET_BONE_HEAD_2 0x000A8771
          #define OFFSET_BONE_HEAD_3 0x001D4B8C
          #define OFFSET_HEADSHOT_1 0x0006984C
          #define OFFSET_HEADSHOT_2 0x000911DF
          #define OFFSET_HEADSHOT_3 0x001DB42C
          #define OFFSET_HEAD_PIC 0x00236A90
          #define OFFSET_HEAD_BTN 0x006C72F5
          #define OFFSET_HEAD_KILL 0x0023111F
          #define OFFSET_HEAD_ONLY 0x002D846E
          #define OFFSET_HIGH_HEAD 0x002D7F47
          #define OFFSET_HEAD_ELEM 0x0006D000
          #define OFFSET_HEAD_TO 0x000B3777
          #define OFFSET_HEAD_OF 0x000B0543
          #define OFFSET_HEAD_TAG 0x00066EA5

          typedef struct {
              float x;
              float y;
              float z;
              float w;
          } Vector4;

          typedef struct {
              bool enabled;
              bool initialized;
              bool menu_visible;
              bool headshot_mode;
              float aim_x;
              float aim_y;
              float aim_z;
              float smoothness;
              float button_x;
              float button_y;
              float button_size;
              float menu_x;
              float menu_y;
              float menu_width;
              float menu_height;
              mach_vm_address_t head_1;
              mach_vm_address_t head_2;
              mach_vm_address_t head_3;
              mach_vm_address_t headshot;
              mach_vm_address_t head_pic;
              mach_vm_address_t head_kill;
              mach_vm_address_t high_head;
              mach_vm_address_t head_elem;
              mach_vm_address_t head_to;
              mach_vm_address_t head_of;
              mach_vm_address_t head_btn;
              mach_vm_address_t head_tag;
          } AimlockState;

          kern_return_t read_memory(task_t task, mach_vm_address_t address, void *buffer, mach_vm_size_t size);
          kern_return_t write_memory(task_t task, mach_vm_address_t address, const void *buffer, mach_vm_size_t size);
          mach_vm_address_t find_pattern(task_t task, mach_vm_address_t start, mach_vm_size_t size, const unsigned char *pattern, size_t pattern_len);
          mach_vm_address_t get_runtime_address(mach_vm_address_t base, uint64_t offset);
          void flush_cache(void *address, size_t size);

          #endif
          EOF

      - name: Tao file aimlock.cpp
        run: |
          cat > src/aimlock.cpp << 'EOF'
          #include "../include/memory_ops.h"
          #include <math.h>

          static AimlockState g_state = {0};
          static pthread_mutex_t g_mutex = PTHREAD_MUTEX_INITIALIZER;
          static bool g_scanning = false;

          const unsigned char patterns[][20] = {
              {0x62, 0x6f, 0x6e, 0x65, 0x5f, 0x48, 0x65, 0x61, 0x64},
              {0x68, 0x65, 0x61, 0x64, 0x73, 0x68, 0x6f, 0x74},
              {0x68, 0x65, 0x61, 0x64, 0x5f, 0x73, 0x68, 0x6f, 0x74},
              {0x68, 0x69, 0x67, 0x68, 0x5f, 0x68, 0x65, 0x61, 0x64},
          };

          void scan_all_offsets(void) {
              if (g_scanning) return;
              g_scanning = true;
              
              task_t task = mach_task_self();
              mach_vm_address_t start = 0x100000000;
              mach_vm_size_t size = 0x40000000;
              
              printf("[Aimlock] Scanning all head offsets...\n");
              
              // Scan bone_Head
              mach_vm_address_t found = find_pattern(task, start, size, patterns[0], 9);
              if (found) {
                  g_state.head_1 = found;
                  g_state.head_2 = found + 0x2000;
                  g_state.head_3 = found + 0x4000;
                  printf("[Aimlock] Bone head at: 0x%llx\n", found);
              }
              
              // Scan headshot
              found = find_pattern(task, start, size, patterns[1], 8);
              if (found) {
                  g_state.headshot = found;
                  printf("[Aimlock] Headshot at: 0x%llx\n", found);
              }
              
              // Scan head_shot
              found = find_pattern(task, start, size, patterns[2], 9);
              if (found) {
                  g_state.head_kill = found;
                  printf("[Aimlock] Head shot kill at: 0x%llx\n", found);
              }
              
              // Scan high_head
              found = find_pattern(task, start, size, patterns[3], 9);
              if (found) {
                  g_state.high_head = found;
                  printf("[Aimlock] High head at: 0x%llx\n", found);
              }
              
              // Use static offsets if not found
              if (g_state.head_1 == 0) {
                  g_state.head_1 = get_runtime_address(0x100000000, OFFSET_BONE_HEAD_1);
                  g_state.head_2 = get_runtime_address(0x100000000, OFFSET_BONE_HEAD_2);
                  g_state.head_3 = get_runtime_address(0x100000000, OFFSET_BONE_HEAD_3);
                  g_state.headshot = get_runtime_address(0x100000000, OFFSET_HEADSHOT_1);
                  g_state.head_pic = get_runtime_address(0x100000000, OFFSET_HEAD_PIC);
                  g_state.head_kill = get_runtime_address(0x100000000, OFFSET_HEAD_KILL);
                  g_state.high_head = get_runtime_address(0x100000000, OFFSET_HIGH_HEAD);
                  g_state.head_elem = get_runtime_address(0x100000000, OFFSET_HEAD_ELEM);
                  g_state.head_to = get_runtime_address(0x100000000, OFFSET_HEAD_TO);
                  g_state.head_of = get_runtime_address(0x100000000, OFFSET_HEAD_OF);
                  g_state.head_btn = get_runtime_address(0x100000000, OFFSET_HEAD_BTN);
                  g_state.head_tag = get_runtime_address(0x100000000, OFFSET_HEAD_TAG);
                  printf("[Aimlock] Using static offsets\n");
              }
              
              g_scanning = false;
          }

          void perform_aimlock(void) {
              pthread_mutex_lock(&g_mutex);
              if (!g_state.enabled || !g_state.initialized) {
                  pthread_mutex_unlock(&g_mutex);
                  return;
              }
              
              task_t task = mach_task_self();
              Vector4 pos;
              
              if (g_state.head_1 != 0) {
                  read_memory(task, g_state.head_1, &pos, sizeof(Vector4));
                  pos.x += g_state.aim_x;
                  pos.y += g_state.aim_y;
                  pos.z += g_state.aim_z;
                  write_memory(task, g_state.head_1, &pos, sizeof(Vector4));
                  
                  if (g_state.head_2 != 0) {
                      write_memory(task, g_state.head_2, &pos, sizeof(Vector4));
                  }
                  if (g_state.head_3 != 0) {
                      write_memory(task, g_state.head_3, &pos, sizeof(Vector4));
                  }
              }
              
              if (g_state.headshot_mode && g_state.headshot != 0) {
                  float multiplier = 10.0;
                  write_memory(task, g_state.headshot, &multiplier, sizeof(float));
              }
              
              pthread_mutex_unlock(&g_mutex);
          }

          void* aimlock_thread(void* arg) {
              while (1) {
                  perform_aimlock();
                  usleep(16667);
              }
              return NULL;
          }

          void toggle_aimlock(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.enabled = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] %s\n", enable ? "Enabled" : "Disabled");
          }

          void toggle_headshot_mode(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.headshot_mode = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Headshot mode %s\n", enable ? "Enabled" : "Disabled");
          }

          void init_aimlock(void) {
              if (g_state.initialized) return;
              printf("[Aimlock] Initializing...\n");
              scan_all_offsets();
              pthread_t thread;
              pthread_create(&thread, NULL, aimlock_thread, NULL);
              pthread_detach(thread);
              g_state.initialized = true;
              printf("[Aimlock] Ready\n");
          }

          __attribute__((constructor)) void init(void) {
              printf("[Aimlock] Loading...\n");
              init_aimlock();
          }
          EOF

      - name: Tao file menu.m
        run: |
          cat > src/menu.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>

          extern void toggle_aimlock(bool);
          extern void toggle_headshot_mode(bool);
          extern void init_aimlock(void);

          static UIWindow *g_window = nil;
          static UIView *g_floatBtn = nil;
          static UIView *g_menu = nil;
          static BOOL g_menuVisible = NO;

          @interface MenuController : UIViewController
          @end

          @implementation MenuController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor clearColor];
              [self createFloatingButton];
              [self createMenu];
              init_aimlock();
          }

          - (void)createFloatingButton {
              CGFloat w = [UIScreen mainScreen].bounds.size.width;
              CGFloat h = [UIScreen mainScreen].bounds.size.height;
              
              g_floatBtn = [[UIView alloc] initWithFrame:CGRectMake(w - 75, h - 160, 55, 55)];
              g_floatBtn.backgroundColor = [UIColor colorWithRed:0.0 green:0.6 blue:1.0 alpha:0.9];
              g_floatBtn.layer.cornerRadius = 27.5;
              g_floatBtn.layer.shadowColor = [UIColor blackColor].CGColor;
              g_floatBtn.layer.shadowOffset = CGSizeMake(0, 2);
              g_floatBtn.layer.shadowOpacity = 0.5;
              g_floatBtn.layer.shadowRadius = 4;
              g_floatBtn.userInteractionEnabled = YES;
              
              UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(8, 12, 40, 30)];
              lbl.text = @"🎯";
              lbl.textAlignment = NSTextAlignmentCenter;
              lbl.font = [UIFont systemFontOfSize:22];
              [g_floatBtn addSubview:lbl];
              
              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(toggleMenu)];
              [g_floatBtn addGestureRecognizer:tap];
              
              UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(drag:)];
              [g_floatBtn addGestureRecognizer:pan];
              
              [self.view addSubview:g_floatBtn];
          }

          - (void)createMenu {
              CGFloat w = [UIScreen mainScreen].bounds.size.width;
              CGFloat h = [UIScreen mainScreen].bounds.size.height;
              
              g_menu = [[UIView alloc] initWithFrame:CGRectMake(40, 80, w - 80, 380)];
              g_menu.backgroundColor = [UIColor colorWithWhite:0.1 alpha:0.95];
              g_menu.layer.cornerRadius = 16;
              g_menu.layer.shadowColor = [UIColor blackColor].CGColor;
              g_menu.layer.shadowOffset = CGSizeMake(0, 4);
              g_menu.layer.shadowOpacity = 0.6;
              g_menu.layer.shadowRadius = 8;
              g_menu.hidden = YES;
              
              // Title
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 16, g_menu.frame.size.width - 40, 28)];
              title.text = @"🎯 AIMLOCK MENU";
              title.textColor = [UIColor colorWithRed:0.0 green:0.7 blue:1.0 alpha:1.0];
              title.font = [UIFont boldSystemFontOfSize:18];
              title.textAlignment = NSTextAlignmentCenter;
              [g_menu addSubview:title];
              
              // Aimlock button
              UIButton *aimBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              aimBtn.frame = CGRectMake(30, 60, g_menu.frame.size.width - 60, 45);
              [aimBtn setTitle:@"🔴 AIMLOCK: OFF" forState:UIControlStateNormal];
              [aimBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              aimBtn.backgroundColor = [UIColor colorWithRed:0.3 green:0.3 blue:0.4 alpha:1.0];
              aimBtn.layer.cornerRadius = 10;
              aimBtn.tag = 100;
              [aimBtn addTarget:self action:@selector(toggleAim:) forControlEvents:UIControlEventTouchUpInside];
              [g_menu addSubview:aimBtn];
              
              // Headshot mode button
              UIButton *hsBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              hsBtn.frame = CGRectMake(30, 115, g_menu.frame.size.width - 60, 40);
              [hsBtn setTitle:@"💀 HEADSHOT MODE: OFF" forState:UIControlStateNormal];
              [hsBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              hsBtn.backgroundColor = [UIColor colorWithRed:0.3 green:0.2 blue:0.3 alpha:1.0];
              hsBtn.layer.cornerRadius = 10;
              hsBtn.tag = 200;
              [hsBtn addTarget:self action:@selector(toggleHS:) forControlEvents:UIControlEventTouchUpInside];
              [g_menu addSubview:hsBtn];
              
              // Aim X slider
              UILabel *xlbl = [[UILabel alloc] initWithFrame:CGRectMake(30, 170, 30, 25)];
              xlbl.text = @"X:";
              xlbl.textColor = [UIColor whiteColor];
              xlbl.font = [UIFont systemFontOfSize:13];
              [g_menu addSubview:xlbl];
              
              UISlider *xs = [[UISlider alloc] initWithFrame:CGRectMake(65, 172, g_menu.frame.size.width - 110, 20)];
              xs.minimumValue = -1.0;
              xs.maximumValue = 1.0;
              xs.value = 0.0;
              xs.tag = 300;
              [xs addTarget:self action:@selector(slider:) forControlEvents:UIControlEventValueChanged];
              [g_menu addSubview:xs];
              
              UILabel *xv = [[UILabel alloc] initWithFrame:CGRectMake(g_menu.frame.size.width - 40, 170, 30, 25)];
              xv.text = @"0.0";
              xv.textColor = [UIColor whiteColor];
              xv.font = [UIFont systemFontOfSize:12];
              xv.tag = 301;
              [g_menu addSubview:xv];
              
              // Aim Y slider
              UILabel *ylbl = [[UILabel alloc] initWithFrame:CGRectMake(30, 205, 30, 25)];
              ylbl.text = @"Y:";
              ylbl.textColor = [UIColor whiteColor];
              ylbl.font = [UIFont systemFontOfSize:13];
              [g_menu addSubview:ylbl];
              
              UISlider *ys = [[UISlider alloc] initWithFrame:CGRectMake(65, 207, g_menu.frame.size.width - 110, 20)];
              ys.minimumValue = -1.0;
              ys.maximumValue = 1.0;
              ys.value = 0.0;
              ys.tag = 400;
              [ys addTarget:self action:@selector(slider:) forControlEvents:UIControlEventValueChanged];
              [g_menu addSubview:ys];
              
              UILabel *yv = [[UILabel alloc] initWithFrame:CGRectMake(g_menu.frame.size.width - 40, 205, 30, 25)];
              yv.text = @"0.0";
              yv.textColor = [UIColor whiteColor];
              yv.font = [UIFont systemFontOfSize:12];
              yv.tag = 401;
              [g_menu addSubview:yv];
              
              // Aim Z slider
              UILabel *zlbl = [[UILabel alloc] initWithFrame:CGRectMake(30, 240, 30, 25)];
              zlbl.text = @"Z:";
              zlbl.textColor = [UIColor whiteColor];
              zlbl.font = [UIFont systemFontOfSize:13];
              [g_menu addSubview:zlbl];
              
              UISlider *zs = [[UISlider alloc] initWithFrame:CGRectMake(65, 242, g_menu.frame.size.width - 110, 20)];
              zs.minimumValue = -1.0;
              zs.maximumValue = 1.0;
              zs.value = 0.0;
              zs.tag = 500;
              [zs addTarget:self action:@selector(slider:) forControlEvents:UIControlEventValueChanged];
              [g_menu addSubview:zs];
              
              UILabel *zv = [[UILabel alloc] initWithFrame:CGRectMake(g_menu.frame.size.width - 40, 240, 30, 25)];
              zv.text = @"0.0";
              zv.textColor = [UIColor whiteColor];
              zv.font = [UIFont systemFontOfSize:12];
              zv.tag = 501;
              [g_menu addSubview:zv];
              
              // Close button
              UIButton *close = [UIButton buttonWithType:UIButtonTypeSystem];
              close.frame = CGRectMake(g_menu.frame.size.width - 50, 10, 35, 35);
              [close setTitle:@"✕" forState:UIControlStateNormal];
              [close setTitleColor:[UIColor colorWithRed:1.0 green:0.2 blue:0.2 alpha:1.0] forState:UIControlStateNormal];
              close.titleLabel.font = [UIFont boldSystemFontOfSize:18];
              [close addTarget:self action:@selector(closeMenu) forControlEvents:UIControlEventTouchUpInside];
              [g_menu addSubview:close];
              
              [self.view addSubview:g_menu];
          }

          - (void)toggleMenu {
              g_menuVisible = !g_menuVisible;
              g_menu.hidden = !g_menuVisible;
              g_floatBtn.hidden = g_menuVisible;
          }

          - (void)closeMenu {
              g_menuVisible = NO;
              g_menu.hidden = YES;
              g_floatBtn.hidden = NO;
          }

          - (void)toggleAim:(UIButton *)sender {
              static BOOL on = NO;
              on = !on;
              toggle_aimlock(on);
              [sender setTitle:on ? @"🟢 AIMLOCK: ON" : @"🔴 AIMLOCK: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = on ? [UIColor colorWithRed:0.0 green:0.5 blue:0.2 alpha:1.0] : [UIColor colorWithRed:0.3 green:0.3 blue:0.4 alpha:1.0];
          }

          - (void)toggleHS:(UIButton *)sender {
              static BOOL on = NO;
              on = !on;
              toggle_headshot_mode(on);
              [sender setTitle:on ? @"💀 HEADSHOT: ON" : @"💀 HEADSHOT: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = on ? [UIColor colorWithRed:0.5 green:0.0 blue:0.2 alpha:1.0] : [UIColor colorWithRed:0.3 green:0.2 blue:0.3 alpha:1.0];
          }

          - (void)slider:(UISlider *)sender {
              UILabel *lbl = (UILabel *)[g_menu viewWithTag:sender.tag + 1];
              lbl.text = [NSString stringWithFormat:@"%.1f", sender.value];
              
              extern float g_aim_x, g_aim_y, g_aim_z;
              if (sender.tag == 300) g_aim_x = sender.value;
              else if (sender.tag == 400) g_aim_y = sender.value;
              else if (sender.tag == 500) g_aim_z = sender.value;
          }

          - (void)drag:(UIPanGestureRecognizer *)gesture {
              CGPoint t = [gesture translationInView:self.view];
              CGPoint c = CGPointMake(g_floatBtn.center.x + t.x, g_floatBtn.center.y + t.y);
              CGFloat w = [UIScreen mainScreen].bounds.size.width;
              CGFloat h = [UIScreen mainScreen].bounds.size.height;
              c.x = MAX(30, MIN(w - 30, c.x));
              c.y = MAX(30, MIN(h - 30, c.y));
              g_floatBtn.center = c;
              [gesture setTranslation:CGPointZero inView:self.view];
          }

          @end

          static void setup(void) {
              if (g_window) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindowScene *scene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  g_window = [[UIWindow alloc] initWithWindowScene:scene];
                  g_window.rootViewController = [[MenuController alloc] init];
                  g_window.windowLevel = UIWindowLevelAlert + 1;
                  g_window.backgroundColor = [UIColor clearColor];
                  g_window.hidden = NO;
                  [g_window makeKeyAndVisible];
                  printf("[Aimlock] Menu ready\n");
              });
          }

          __attribute__((constructor)) void init(void) {
              printf("[Aimlock] Loading menu...\n");
              setup();
          }
          EOF

      - name: Bien dich dylib
        run: |
          clang++ -arch arm64 -arch armv7 \
              -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
              -framework UIKit -framework Foundation -framework CoreGraphics \
              -framework QuartzCore -framework CoreFoundation \
              -dynamiclib -mios-version-min=12.0 \
              -Os -flto -fvisibility=hidden \
              -Wl,-dead_strip \
              -o libaimlock.dylib \
              src/aimlock.cpp src/menu.m \
              -I./include \
              -ObjC -fobjc-arc

      - name: Strip va kiem tra
        run: |
          strip -S -x libaimlock.dylib
          echo "Dylib size:"
          ls -la libaimlock.dylib
          echo "Symbols:"
          nm -gU libaimlock.dylib | head -10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaimlock
          path: libaimlock.dylib
          retention-days: 7