              -framework QuartzCore -framework CoreFoundation \
              -dynamiclib -mios-version-min=14.0 \
              -Os -flto -fvisibility=hidden \
              -Wl,-dead_strip \
              -o libaimlock.dylib \
              src/memory_ops.cpp src/aimlock.cpp src/menu.m \
              -I./include \
              -ObjC -fobjc-arc

      - name: Kiem tra file dylib
        run: |
          if [ -f "libaimlock.dylib" ]; then
            echo "Build successful"
            file libaimlock.dylib
            otool -L libaimlock.dylib
            size libaimlock.dylib
            ls -la libaimlock.dylib
            nm -gU libaimlock.dylib | head -20
          else
            echo "Build failed"
            exit 1
          fi

      - name: Tinh checksum
        run: |
          shasum -a 256 libaimlock.dylib > libaimlock.dylib.sha256
          cat libaimlock.dylib.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaimlock
          path: |
            libaimlock.dylib
            libaimlock.dylib.sha256
          retention-days: 7