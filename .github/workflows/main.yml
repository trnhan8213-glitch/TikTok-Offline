          - (void)toggleAimlock:(UIButton *)sender {
              g_aimlock_active = !g_aimlock_active;
              toggle_aimlock(g_aimlock_active);
              [sender setTitle:g_aimlock_active ? @"🟢 AIMLOCK: ON" : @"🔴 AIMLOCK: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = g_aimlock_active ? [UIColor colorWithRed:0.0 green:0.5 blue:0.2 alpha:1.0] : [UIColor colorWithRed:0.3 green:0.3 blue:0.4 alpha:1.0];
          }

          - (void)toggleHeadshot:(UIButton *)sender {
              g_headshot_active = !g_headshot_active;
              toggle_headshot_mode(g_headshot_active);
              [sender setTitle:g_headshot_active ? @"💀 HEADSHOT: ON" : @"💀 HEADSHOT: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = g_headshot_active ? [UIColor colorWithRed:0.5 green:0.0 blue:0.2 alpha:1.0] : [UIColor colorWithRed:0.3 green:0.2 blue:0.3 alpha:1.0];
          }

          - (void)toggleAssist:(UIButton *)sender {
              g_aim_assist_active = !g_aim_assist_active;
              toggle_aim_assist(g_aim_assist_active);
              [sender setTitle:g_aim_assist_active ? @"🎯 AIM ASSIST: ON" : @"🎯 AIM ASSIST: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = g_aim_assist_active ? [UIColor colorWithRed:0.0 green:0.4 blue:0.5 alpha:1.0] : [UIColor colorWithRed:0.2 green:0.3 blue:0.4 alpha:1.0];
          }

          - (void)toggleFire:(UIButton *)sender {
              g_auto_fire_active = !g_auto_fire_active;
              toggle_auto_fire(g_auto_fire_active);
              [sender setTitle:g_auto_fire_active ? @"🔥 AUTO FIRE: ON" : @"🔥 AUTO FIRE: OFF" forState:UIControlStateNormal];
              sender.backgroundColor = g_auto_fire_active ? [UIColor colorWithRed:0.5 green:0.2 blue:0.0 alpha:1.0] : [UIColor colorWithRed:0.4 green:0.2 blue:0.2 alpha:1.0];
          }

          - (void)sliderChanged:(UISlider *)sender {
              if (sender == self.xSlider) {
                  self.xValue.text = [NSString stringWithFormat:@"%.1f", sender.value];
                  g_aim_x = sender.value;
              } else if (sender == self.ySlider) {
                  self.yValue.text = [NSString stringWithFormat:@"%.1f", sender.value];
                  g_aim_y = sender.value;
              } else if (sender == self.zSlider) {
                  self.zValue.text = [NSString stringWithFormat:@"%.1f", sender.value];
                  g_aim_z = sender.value;
              }
          }

          - (void)resetValues {
              self.xSlider.value = 0.0;
              self.ySlider.value = 0.0;
              self.zSlider.value = 0.0;
              self.xValue.text = @"0.0";
              self.yValue.text = @"0.0";
              self.zValue.text = @"0.0";
              g_aim_x = 0.0;
              g_aim_y = 0.0;
              g_aim_z = 0.0;
              reset_aim_values();
          }

          - (void)dragButton:(UIPanGestureRecognizer *)gesture {
              CGPoint translation = [gesture translationInView:self.view];
              CGPoint newCenter = CGPointMake(g_floating_button.center.x + translation.x, g_floating_button.center.y + translation.y);
              CGFloat screenWidth = [UIScreen mainScreen].bounds.size.width;
              CGFloat screenHeight = [UIScreen mainScreen].bounds.size.height;
              newCenter.x = MAX(30, MIN(screenWidth - 30, newCenter.x));
              newCenter.y = MAX(30, MIN(screenHeight - 30, newCenter.y));
              g_floating_button.center = newCenter;
              [gesture setTranslation:CGPointZero inView:self.view];
          }

          @end

          static void setupOverlay(void) {
              if (g_overlay_window) return;
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindowScene *scene = (UIWindowScene *)[UIApplication sharedApplication].connectedScenes.allObjects.firstObject;
                  if (!scene) {
                      scene = (UIWindowScene *)[[[UIApplication sharedApplication] windows] firstObject].windowScene;
                  }
                  g_overlay_window = [[UIWindow alloc] initWithWindowScene:scene];
                  g_overlay_window.rootViewController = [[MenuViewController alloc] init];
                  g_overlay_window.windowLevel = UIWindowLevelAlert + 1;
                  g_overlay_window.backgroundColor = [UIColor clearColor];
                  g_overlay_window.hidden = NO;
                  [g_overlay_window makeKeyAndVisible];
                  printf("[Aimlock] Menu overlay created\n");
              });
          }

          __attribute__((constructor)) void menu_init(void) {
              printf("[Aimlock] Loading menu...\n");
              setupOverlay();
          }

          __attribute__((destructor)) void menu_deinit(void) {
              printf("[Aimlock] Unloading menu...\n");
              dispatch_async(dispatch_get_main_queue(), ^{
                  g_overlay_window.hidden = YES;
                  g_overlay_window = nil;
              });
          }
          EOF

