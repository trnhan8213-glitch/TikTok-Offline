          void perform_aimlock(void) {
              pthread_mutex_lock(&g_mutex);
              if (!g_state.enabled || !g_state.initialized) {
                  pthread_mutex_unlock(&g_mutex);
                  return;
              }

              task_t task = mach_task_self();
              Vector4 pos;

              if (g_state.head_1 != 0) {
                  if (read_memory(task, g_state.head_1, &pos, sizeof(Vector4)) == KERN_SUCCESS) {
                      pos.x += g_state.aim_x;
                      pos.y += g_state.aim_y;
                      pos.z += g_state.aim_z;
                      write_memory(task, g_state.head_1, &pos, sizeof(Vector4));
                      if (g_state.head_2 != 0) {
                          write_memory(task, g_state.head_2, &pos, sizeof(Vector4));
                      }
                      if (g_state.head_3 != 0) {
                          write_memory(task, g_state.head_3, &pos, sizeof(Vector4));
                      }
                  }
              }

              if (g_state.headshot_mode && g_state.headshot_1 != 0) {
                  float multiplier = 10.0;
                  write_memory(task, g_state.headshot_1, &multiplier, sizeof(float));
                  if (g_state.headshot_2 != 0) {
                      write_memory(task, g_state.headshot_2, &multiplier, sizeof(float));
                  }
                  if (g_state.headshot_3 != 0) {
                      write_memory(task, g_state.headshot_3, &multiplier, sizeof(float));
                  }
              }

              if (g_state.aim_assist && g_state.high_head != 0) {
                  float assist_value = 1.0;
                  write_memory(task, g_state.high_head, &assist_value, sizeof(float));
              }

              if (g_state.auto_fire && g_state.head_btn != 0) {
                  uint32_t fire = 1;
                  write_memory(task, g_state.head_btn, &fire, sizeof(uint32_t));
              }

              g_frame_counter++;
              if (g_frame_counter % 60 == 0) {
                  update_kill_stats();
              }

              pthread_mutex_unlock(&g_mutex);
          }

          void perform_headshot(void) {
              pthread_mutex_lock(&g_mutex);
              if (!g_state.initialized) {
                  pthread_mutex_unlock(&g_mutex);
                  return;
              }

              task_t task = mach_task_self();
              if (g_state.headshot_1 != 0) {
                  float multiplier = 20.0;
                  write_memory(task, g_state.headshot_1, &multiplier, sizeof(float));
                  if (g_state.headshot_2 != 0) {
                      write_memory(task, g_state.headshot_2, &multiplier, sizeof(float));
                  }
                  if (g_state.headshot_3 != 0) {
                      write_memory(task, g_state.headshot_3, &multiplier, sizeof(float));
                  }
              }
              pthread_mutex_unlock(&g_mutex);
          }

          void perform_aim_assist(void) {
              pthread_mutex_lock(&g_mutex);
              if (!g_state.initialized || !g_state.aim_assist) {
                  pthread_mutex_unlock(&g_mutex);
                  return;
              }

              task_t task = mach_task_self();
              if (g_state.high_head != 0) {
                  float assist = 1.5;
                  write_memory(task, g_state.high_head, &assist, sizeof(float));
              }
              pthread_mutex_unlock(&g_mutex);
          }

          void update_kill_stats(void) {
              task_t task = mach_task_self();
              if (g_state.head_kill != 0) {
                  uint32_t kills = 0;
                  if (read_memory(task, g_state.head_kill, &kills, sizeof(uint32_t)) == KERN_SUCCESS) {
                      g_state.kill_count = kills;
                      if (g_state.headshot_1 != 0) {
                          uint32_t hs = 0;
                          if (read_memory(task, g_state.headshot_1, &hs, sizeof(uint32_t)) == KERN_SUCCESS) {
                              g_state.headshot_count = hs;
                          }
                      }
                  }
              }
          }

          void reset_aim_values(void) {
              pthread_mutex_lock(&g_mutex);
              g_state.aim_x = 0.0;
              g_state.aim_y = 0.0;
              g_state.aim_z = 0.0;
              g_state.smoothness = 0.5;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Aim values reset\n");
          }

          void* aimlock_thread(void* arg) {
              while (1) {
                  perform_aimlock();
                  if (g_state.headshot_mode) {
                      perform_headshot();
                  }
                  if (g_state.aim_assist) {
                      perform_aim_assist();
                  }
                  usleep(16667);
              }
              return NULL;
          }

          void toggle_aimlock(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.enabled = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Aimlock %s\n", enable ? "Enabled" : "Disabled");
              if (enable && g_state.head_1 == 0) {
                  scan_all_offsets();
              }
          }

          void toggle_headshot_mode(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.headshot_mode = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Headshot mode %s\n", enable ? "Enabled" : "Disabled");
          }

          void toggle_aim_assist(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.aim_assist = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Aim assist %s\n", enable ? "Enabled" : "Disabled");
          }

          void toggle_auto_fire(bool enable) {
              pthread_mutex_lock(&g_mutex);
              g_state.auto_fire = enable;
              pthread_mutex_unlock(&g_mutex);
              printf("[Aimlock] Auto fire %s\n", enable ? "Enabled" : "Disabled");
          }

          void init_aimlock(void) {
              if (g_state.initialized) {
                  return;
              }
              printf("[Aimlock] Initializing...\n");
              scan_all_offsets();
              pthread_t thread;
              pthread_create(&thread, NULL, aimlock_thread, NULL);
              pthread_detach(thread);
              g_state.initialized = true;
              printf("[Aimlock] Ready - %zu offsets found\n", sizeof(AimlockState));
          }

          // Global variables for UI
          float g_aim_x = 0.0;
          float g_aim_y = 0.0;
          float g_aim_z = 0.0;

          __attribute__((constructor)) void aimlock_init(void) {
              printf("[Aimlock] Loading aimlock...\n");
              init_aimlock();
          }

          __attribute__((destructor)) void aimlock_deinit(void) {
              printf("[Aimlock] Unloading aimlock...\n");
              g_state.initialized = false;
          }
          EOF

