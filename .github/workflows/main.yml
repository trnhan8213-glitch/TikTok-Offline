# .github/workflows/build.yml
name: Build iOS Deb Package for TrollStore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        brew install dpkg ldid
        sudo gem install xcodeproj
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH
    
    - name: Create project structure
      run: |
        mkdir -p layout/DEBIAN
        mkdir -p layout/Library/MobileSubstrate/DynamicLibraries
        mkdir -p layout/usr/lib
        mkdir -p src
    
    - name: Generate control file
      run: |
        cat > layout/DEBIAN/control << 'EOF'
        Package: com.freefire.aimlock
        Name: AimLock
        Version: 1.0.0
        Architecture: iphoneos-arm
        Description: Memory aim assist for FreeFire
        Maintainer: dev@local
        Author: dev
        Section: Tweaks
        Depends: mobilesubstrate (>= 0.9.5000)
        EOF
    
    - name: Generate postinst script
      run: |
        cat > layout/DEBIAN/postinst << 'EOF'
        #!/bin/sh
        chmod 755 /Library/MobileSubstrate/DynamicLibraries/AimLock.dylib
        killall -9 FreeFire
        uicache -a
        EOF
        chmod 755 layout/DEBIAN/postinst
    
    - name: Generate prerm script
      run: |
        cat > layout/DEBIAN/prerm << 'EOF'
        #!/bin/sh
        killall -9 FreeFire
        EOF
        chmod 755 layout/DEBIAN/prerm
    
    - name: Generate Tweak source code
      run: |
        cat > src/Tweak.x << 'EOF'
        #import <UIKit/UIKit.h>
        #import <mach/mach.h>
        #import <mach/vm_map.h>
        #import <mach/mach_vm.h>
        #import <dlfcn.h>
        #import <math.h>
        
        typedef struct {
            float x;
            float y;
            float z;
        } Vector3;
        
        typedef struct {
            Vector3 position;
            Vector3 rotation;
            float fov;
            BOOL isVisible;
            float health;
            float distance;
        } EnemyData;
        
        static mach_port_t task_port = MACH_PORT_NULL;
        static vm_size_t page_size = 0;
        static vm_address_t enemy_base_address = 0x0;
        
        static void init_memory_access(void) {
            if (task_port == MACH_PORT_NULL) {
                task_port = mach_task_self();
                vm_size_t page_size_out;
                host_page_size(mach_host_self(), &page_size_out);
                page_size = page_size_out;
            }
            
            if (enemy_base_address == 0x0) {
                enemy_base_address = 0x108000000;
            }
        }
        
        static Vector3 calculate_aim_angle(Vector3 target_pos, Vector3 current_pos) {
            float delta_x = target_pos.x - current_pos.x;
            float delta_y = target_pos.y - current_pos.y;
            float delta_z = target_pos.z - current_pos.z;
            
            float horizontal_angle = atan2f(delta_y, delta_x) * 180.0f / M_PI;
            float vertical_angle = atan2f(delta_z, sqrtf(delta_x * delta_x + delta_y * delta_y)) * 180.0f / M_PI;
            
            Vector3 result;
            result.x = horizontal_angle;
            result.y = vertical_angle;
            result.z = 0.0f;
            return result;
        }
        
        static void apply_aimbot(void) {
            init_memory_access();
            
            kern_return_t kr;
            vm_address_t read_address = enemy_base_address;
            vm_size_t read_size = 0x4000;
            vm_offset_t local_buffer = 0;
            vm_size_t local_size = 0;
            
            kr = vm_read(task_port, read_address, read_size, &local_buffer, &local_size);
            if (kr != KERN_SUCCESS) {
                return;
            }
            
            EnemyData *enemies = (EnemyData *)local_buffer;
            int max_enemies = local_size / sizeof(EnemyData);
            
            EnemyData *closest_enemy = NULL;
            float closest_distance = FLT_MAX;
            
            for (int i = 0; i < max_enemies; i++) {
                if (enemies[i].isVisible && enemies[i].health > 0.0f) {
                    float dist = enemies[i].distance;
                    if (dist < closest_distance) {
                        closest_distance = dist;
                        closest_enemy = &enemies[i];
                    }
                }
            }
            
            if (closest_enemy != NULL) {
                Vector3 current_position = {0.0f, 0.0f, 0.0f};
                Vector3 aim_angle = calculate_aim_angle(closest_enemy->position, current_position);
                
                vm_address_t rotation_address = enemy_base_address + 
                    ((uintptr_t)closest_enemy - (uintptr_t)enemies) + 
                    offsetof(EnemyData, rotation);
                
                kr = vm_write(task_port, rotation_address, (vm_offset_t)&aim_angle, sizeof(Vector3));
                if (kr != KERN_SUCCESS) {
                }
            }
            
            kr = vm_deallocate(task_port, local_buffer, local_size);
            if (kr != KERN_SUCCESS) {
            }
        }
        
        %hook GameManager
        - (void)update {
            %orig;
            apply_aimbot();
        }
        %end
        
        %hook PlayerController
        - (void)updatePosition {
            %orig;
            Vector3 player_pos = {0.0f, 0.0f, 0.0f};
        }
        %end
        
        %ctor {
            dlopen("/usr/lib/libc++.dylib", RTLD_LAZY);
            init_memory_access();
        }
        EOF
    
    - name: Generate Makefile
      run: |
        cat > src/Makefile << 'EOF'
        export THEOS := $(THEOS)
        export TARGET := iphone:latest:14.0
        export ARCHS := arm64 arm64e
        export DEBUG := 0
        export GO_EASY_ON_ME := 1
        
        include $(THEOS)/makefiles/common.mk
        
        TWEAK_NAME = AimLock
        AimLock_FILES = Tweak.x
        AimLock_CFLAGS = -fobjc-arc -O3 -Wall -Wextra
        AimLock_LDFLAGS = -v -Wl,-U,_vm_region -Wl,-U,_mach_vm_read -Wl,-U,_mach_vm_write
        AimLock_FRAMEWORKS = UIKit CoreGraphics Foundation
        AimLock_PRIVATE_FRAMEWORKS = 
        
        include $(THEOS_MAKE_PATH)/tweak.mk
        
        after-install::
            install.exec "killall -9 FreeFire && uicache -a"
        EOF
    
    - name: Generate AimLock.plist
      run: |
        cat > layout/Library/MobileSubstrate/DynamicLibraries/AimLock.plist << 'EOF'
        {
            Filter = {
                Bundles = ("com.dts.freefireth");
            };
        }
        EOF
    
    - name: Build the tweak
      run: |
        cd src
        export THEOS=$HOME/theos
        export TARGET=iphone:latest:14.0
        make package
        cp packages/*.deb ../layout/
    
    - name: Create final deb package
      run: |
        cd layout
        dpkg-deb -b . ../com.freefire.aimlock_1.0.0_iphoneos-arm.deb
        cd ..
        mkdir -p release
        cp com.freefire.aimlock_1.0.0_iphoneos-arm.deb release/
    
    - name: Upload artifact for TrollStore
      uses: actions/upload-artifact@v4
      with:
        name: TrollStore-AimLock
        path: release/com.freefire.aimlock_1.0.0_iphoneos-arm.deb
        retention-days: 30