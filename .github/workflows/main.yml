      - name: Tao file memory_ops.cpp
        run: |
          cat > src/memory_ops.cpp << 'EOF'
          #include "../include/memory_ops.h"

          static task_t g_task = MACH_PORT_NULL;
          static mach_vm_address_t g_base_address = 0;
          static bool g_initialized = false;

          kern_return_t read_memory(task_t task, mach_vm_address_t address, void *buffer, mach_vm_size_t size) {
              if (task == MACH_PORT_NULL || buffer == NULL || size == 0) {
                  return KERN_INVALID_ARGUMENT;
              }
              mach_vm_size_t out_size = 0;
              kern_return_t kr = mach_vm_read_overwrite(task, address, size, (vm_address_t)buffer, &out_size);
              if (kr != KERN_SUCCESS) {
                  printf("[Aimlock] Read memory failed at 0x%llx, error: %d\n", address, kr);
              }
              return kr;
          }

          kern_return_t write_memory(task_t task, mach_vm_address_t address, const void *buffer, mach_vm_size_t size) {
              if (task == MACH_PORT_NULL || buffer == NULL || size == 0) {
                  return KERN_INVALID_ARGUMENT;
              }
              vm_size_t page_size = 0;
              host_page_size(mach_host_self(), &page_size);
              mach_vm_address_t page_start = address & ~(page_size - 1);
              mach_vm_size_t region_size = size + (address - page_start);
              kern_return_t kr = mach_vm_protect(task, page_start, region_size, false, VM_PROT_READ | VM_PROT_WRITE | VM_PROT_COPY);
              if (kr != KERN_SUCCESS) {
                  printf("[Aimlock] Failed to change protection at 0x%llx, error: %d\n", page_start, kr);
                  return kr;
              }
              kr = mach_vm_write(task, address, (vm_offset_t)buffer, size);
              if (kr != KERN_SUCCESS) {
                  printf("[Aimlock] Write memory failed at 0x%llx, error: %d\n", address, kr);
                  mach_vm_protect(task, page_start, region_size, false, VM_PROT_READ | VM_PROT_EXECUTE);
                  return kr;
              }
              flush_cache_arm64((void*)address, size);
              kr = mach_vm_protect(task, page_start, region_size, false, VM_PROT_READ | VM_PROT_EXECUTE);
              if (kr != KERN_SUCCESS) {
                  printf("[Aimlock] Failed to restore protection, error: %d\n", kr);
              }
              printf("[Aimlock] Wrote %zu bytes at 0x%llx\n", size, address);
              return KERN_SUCCESS;
          }

          kern_return_t protect_memory(task_t task, mach_vm_address_t address, mach_vm_size_t size, vm_prot_t prot) {
              if (task == MACH_PORT_NULL || address == 0 || size == 0) {
                  return KERN_INVALID_ARGUMENT;
              }
              vm_size_t page_size = 0;
              host_page_size(mach_host_self(), &page_size);
              mach_vm_address_t page_start = address & ~(page_size - 1);
              mach_vm_size_t region_size = size + (address - page_start);
              return mach_vm_protect(task, page_start, region_size, false, prot);
          }

          mach_vm_address_t find_pattern_in_memory(task_t task, mach_vm_address_t start, mach_vm_size_t size, const unsigned char *pattern, size_t pattern_len) {
              if (task == MACH_PORT_NULL || pattern == NULL || pattern_len == 0 || size == 0) {
                  return 0;
              }
              unsigned char *buffer = (unsigned char*)malloc(size);
              if (!buffer) {
                  return 0;
              }
              kern_return_t kr = read_memory(task, start, buffer, size);
              if (kr != KERN_SUCCESS) {
                  free(buffer);
                  return 0;
              }
              for (mach_vm_address_t i = 0; i <= size - pattern_len; i++) {
                  if (memcmp(buffer + i, pattern, pattern_len) == 0) {
                      mach_vm_address_t found = start + i;
                      free(buffer);
                      return found;
                  }
              }
              free(buffer);
              return 0;
          }

          mach_vm_address_t get_runtime_address(mach_vm_address_t base, uint64_t offset) {
              return base + offset;
          }

          void flush_cache_arm64(void *address, size_t size) {
              if (address == NULL || size == 0) {
                  return;
              }
              __asm__ volatile (
                  "dc cvau, %0\n"
                  "dsb ish\n"
                  "ic ivau, %0\n"
                  "dsb ish\n"
                  "isb\n"
                  : : "r"(address)
                  : "memory"
              );
          }

          __attribute__((constructor)) void init_memory_ops(void) {
              printf("[Aimlock] Memory operations initialized\n");
              g_task = mach_task_self();
              g_initialized = true;
          }
          EOF

