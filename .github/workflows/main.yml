          static pthread_mutex_t g_mutex = PTHREAD_MUTEX_INITIALIZER;
          static bool g_scanning = false;
          static uint32_t g_frame_counter = 0;

          // Pattern arrays for scanning
          static const unsigned char pattern_bone_head[] = {
